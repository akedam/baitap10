<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JWT Nimbus - Đăng nhập</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 64px auto; padding: 0 16px; }
        form { display: grid; gap: 12px; padding: 24px; border: 1px solid #ddd; border-radius: 12px; }
        input, button { font: inherit; padding: 10px; }
        button { cursor: pointer; }
        #message { min-height: 24px; }
    </style>
</head>
<body>
<h1>Đăng nhập JWT Nimbus</h1>
<p>Tạo tài khoản qua <code>POST /auth/signup</code>, sau đó đăng nhập tại đây.</p>
<form id="login-form">
    <label>Email <input id="email" type="email" required></label>
    <label>Mật khẩu <input id="password" type="password" required></label>
    <button type="submit">Đăng nhập</button>
    <div id="message" role="status"></div>
</form>
<script src="/js/main.js"></script>
</body>
</html>
