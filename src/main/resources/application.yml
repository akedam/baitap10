spring:
  application:
    name: jwt-nimbus-demo
  datasource:
    url: jdbc:h2:mem:jwt_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8005

security:
  jwt:
    # Biến môi trường JWT_SECRET nên được dùng ở môi trường thật.
    secret-key: ${JWT_SECRET:change-this-demo-secret-key-32-bytes-minimum-2026}
    expiration-time: 3600000
    issuer: jwt-nimbus-demo
